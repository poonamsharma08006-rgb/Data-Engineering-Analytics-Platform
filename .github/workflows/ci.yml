name: CI
on: [push,pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m compileall pipeline dashboard
      - run: python - <<'PY'
          import pandas as pd
          from pipeline.quality import validate,clean
          d=pd.read_csv("data/sales.csv")
          assert validate(d)["missing_columns"] == []
          assert len(clean(d)) > 0
          print("ETL validation passed")
        PY
