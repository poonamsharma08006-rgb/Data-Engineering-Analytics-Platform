name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall pipeline dashboard

      - name: Validate sales dataset
        run: |
          python -c "import pandas as pd; from pipeline.quality import validate, clean; d=pd.read_csv('data/sales.csv'); assert validate(d)['missing_columns'] == []; assert len(clean(d)) > 0; print('ETL validation passed')"